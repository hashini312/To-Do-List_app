<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <h1>To<i>day</i></h1>
        <p class="sub" id="sub">
            Start adding your tasks below.
        </p>

        <div class="input-row">
            <input type="text" id="inp" placeholder="Add a task..." maxlength="100">
            <button class="add" onclick="add()">+</button>
        </div>
        <ul id="list"></ul>
        <p class="empty" id="empty">
            Nothing here - enjoy the quiet
        </p>
    </div>
    <script src="index.js"></script>
</body>
</html>
